name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath varagh-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: varagh-windows-x64
          path: varagh-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - run: cp packaging/linux/install.sh packaging/linux/uninstall.sh assets/icon/varagh.png build/linux/x64/release/bundle/
      - run: tar -C build/linux/x64/release -czf varagh-linux-x64.tar.gz --transform 's/^bundle/varagh/' bundle
      # The package takes its version from the tag (v1.2.3 -> 1.2.3) and
      # gets a fixed file name, so the "latest release" link stays the same.
      - run: |
          version=0.0.0
          case "$GITHUB_REF" in refs/tags/v*) version=${GITHUB_REF_NAME#v} ;; esac
          sh packaging/linux/build-deb.sh "$version" .
          mv "varagh_${version}_amd64.deb" varagh-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: varagh-linux-x64
          path: |
            varagh-linux-x64.tar.gz
            varagh-linux-amd64.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Signed with the debug key: fine for installing by hand, not for a
      # store, and an update only installs over a build signed the same way.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk varagh-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: varagh-android
          path: varagh-android.apk

  # On a version tag, gathers the three builds into a release so they can
  # be downloaded without signing in to GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            varagh-windows-x64.zip
            varagh-linux-x64.tar.gz
            varagh-linux-amd64.deb
            varagh-android.apk
